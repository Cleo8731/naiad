[package]
name = "naiad"
version = "0.1.0"
description = "A lightweight viewer/editor for plain Mermaid flowchart files"
license = "MIT"
edition = "2021"
# Two programs: the app (src/main.rs) and the `naiad` command (src/bin/naiad-cli.rs).
default-run = "naiad"

[lib]
name = "naiad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "8"
# Random numbers for the secret of `naiad serve`. Already part of the build: tauri's
# own packages use it.
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
