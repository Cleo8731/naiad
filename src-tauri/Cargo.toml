[package]
name = "naiad"
version = "0.1.0"
description = "A lightweight viewer/editor for plain Mermaid flowchart files"
edition = "2021"

[lib]
name = "naiad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
